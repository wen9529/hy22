# 策略组配置
proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - ⚖️ 负载均衡
      - "Hysteria2-01"
      - "Hysteria2-01 [IPv4直连]"
      - "Hysteria2-02"
      - "Hysteria2-02 [IPv4直连]"
      - "Hysteria2-03"
      - "Hysteria2-03 [IPv4直连]"
      - "Hysteria2-04"
      - "Hysteria2-04 [IPv4直连]"
      - DIRECT

  - name: ♻️ 自动选择
    type: url-test
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
      - "Hysteria2-01"
      - "Hysteria2-01 [IPv4直连]"
      - "Hysteria2-02"
      - "Hysteria2-02 [IPv4直连]"
      - "Hysteria2-03"
      - "Hysteria2-03 [IPv4直连]"
      - "Hysteria2-04"
      - "Hysteria2-04 [IPv4直连]"

  - name: ⚖️ 负载均衡
    type: load-balance
    strategy: consistent-hashing
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    proxies:
      - "Hysteria2-01"
      - "Hysteria2-01 [IPv4直连]"
      - "Hysteria2-02"
      - "Hysteria2-02 [IPv4直连]"
      - "Hysteria2-03"
      - "Hysteria2-03 [IPv4直连]"
      - "Hysteria2-04"
      - "Hysteria2-04 [IPv4直连]"

  - name: 🎯 全球直连
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择

  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🚀 节点选择
      - 🎯 全球直连

# 分流规则
rules:
  - GEOSITE,private,🎯 全球直连
  - GEOIP,private,🎯 全球直连,no-resolve
  - GEOSITE,category-games@cn,🎯 全球直连
  - GEOSITE,cn,🎯 全球直连
  - GEOIP,CN,🎯 全球直连
  - MATCH,🚀 节点选择
