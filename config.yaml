# -------------------------------------------------------------
# Clash Meta (Mihomo) & Karing 自动订阅配置 (全端高兼容完美版)
# -------------------------------------------------------------
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: true
unified-delay: true
tcp-concurrent: true
external-controller: 127.0.0.1:9090

dns:
  enable: true
  ipv6: true
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 1.1.1.1
    - 8.8.8.8
    - 2400:3200::1

# 节点配置列表 (自动注入完整参数)
proxies:
  - name: HY2 节点 01 (IPv4 域名 838491)
    server: www.838491.xyz
    port: 13377
    password: dongtaiwang.com
    auth: dongtaiwang.com
    sni: www.838491.xyz
    skip-cert-verify: true
    alpn:
    - h3
    up: 11 mbps
    down: 55 mbps
    fast-open: true
    type: hysteria2
  - name: HY2 节点 02 (IPv4 直连 62.210.8.122)
    server: 62.210.8.122
    port: 13377
    password: dongtaiwang.com
    auth: dongtaiwang.com
    sni: www.838491.xyz
    skip-cert-verify: true
    alpn:
    - h3
    up: 11 mbps
    down: 55 mbps
    fast-open: true
    type: hysteria2
  - name: HY2 节点 03 (IPv4 直连 62.210.70.191)
    server: 62.210.70.191
    port: 22000
    password: dongtaiwang.com
    auth: dongtaiwang.com
    sni: www.microsoft.com
    skip-cert-verify: true
    alpn:
    - h3
    up: 11 mbps
    down: 55 mbps
    fast-open: true
    type: hysteria2
  - name: HY2 节点 04 (IPv6 2001:bc8:32d7:17b::3)
    server: 2001:bc8:32d7:17b::3
    port: 22000
    password: dongtaiwang.com
    auth: dongtaiwang.com
    sni: www.microsoft.com
    skip-cert-verify: true
    alpn:
    - h3
    up: 11 mbps
    down: 55 mbps
    fast-open: true
    type: hysteria2
  - name: HY2 节点 05 (IPv6 2001:bc8:32d7:17b::8)
    server: 2001:bc8:32d7:17b::8
    port: 22000
    password: dongtaiwang.com
    auth: dongtaiwang.com
    sni: www.microsoft.com
    skip-cert-verify: true
    alpn:
    - h3
    up: 11 mbps
    down: 55 mbps
    fast-open: true
    type: hysteria2

# 策略组配置
proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - ⚖️ 负载均衡
      - DIRECT
      - "HY2 节点 01 (IPv4 域名 838491)"
      - "HY2 节点 02 (IPv4 直连 62.210.8.122)"
      - "HY2 节点 03 (IPv4 直连 62.210.70.191)"
      - "HY2 节点 04 (IPv6 2001:bc8:32d7:17b::3)"
      - "HY2 节点 05 (IPv6 2001:bc8:32d7:17b::8)"

  - name: ♻️ 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
      - "HY2 节点 01 (IPv4 域名 838491)"
      - "HY2 节点 02 (IPv4 直连 62.210.8.122)"
      - "HY2 节点 03 (IPv4 直连 62.210.70.191)"
      - "HY2 节点 04 (IPv6 2001:bc8:32d7:17b::3)"
      - "HY2 节点 05 (IPv6 2001:bc8:32d7:17b::8)"

  - name: ⚖️ 负载均衡
    type: load-balance
    strategy: consistent-hashing
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - "HY2 节点 01 (IPv4 域名 838491)"
      - "HY2 节点 02 (IPv4 直连 62.210.8.122)"
      - "HY2 节点 03 (IPv4 直连 62.210.70.191)"
      - "HY2 节点 04 (IPv6 2001:bc8:32d7:17b::3)"
      - "HY2 节点 05 (IPv6 2001:bc8:32d7:17b::8)"

  - name: 🎯 全球直连
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择

  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🚀 节点选择
      - 🎯 全球直连

# 分流规则 (精简高兼容，避免 Android/Karing 缺少 GeoSite 库报错)
rules:
  - GEOIP,LAN,DIRECT,no-resolve
  - GEOIP,CN,DIRECT
  - MATCH,🚀 节点选择
