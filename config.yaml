# -------------------------------------------------------------
# Clash Meta (Mihomo) & Karing 自动订阅配置 (全端高兼容完美版)
# -------------------------------------------------------------
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
external-controller: 127.0.0.1:9090

dns:
  enable: true
  ipv6: false
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 1.1.1.1
    - 8.8.8.8

