# 策略组配置
proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - ⚖️ 负载均衡
      - DIRECT
      - "Xray-VLESS-IPv4-01"
      - "Xray-VLESS-IPv4-02"
      - "Xray-VLESS-IPv6-03"
      - "Xray-VLESS-IPv6-04"
      - "Hysteria-IPv4-01"
      - "Hysteria-IPv4-02"
      - "Hysteria-IPv4-03"
      - "Hysteria-IPv4-04"
      - "Hysteria-IPv6-05"
      - "Hysteria-IPv6-06"
      - "Xray-VLESS-Backup-05"

  - name: ♻️ 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
      - "Xray-VLESS-IPv4-01"
      - "Xray-VLESS-IPv4-02"
      - "Xray-VLESS-IPv6-03"
      - "Xray-VLESS-IPv6-04"
      - "Hysteria-IPv4-01"
      - "Hysteria-IPv4-02"
      - "Hysteria-IPv4-03"
      - "Hysteria-IPv4-04"
      - "Hysteria-IPv6-05"
      - "Hysteria-IPv6-06"
      - "Xray-VLESS-Backup-05"

  - name: ⚖️ 负载均衡
    type: load-balance
    strategy: consistent-hashing
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - "Xray-VLESS-IPv4-01"
      - "Xray-VLESS-IPv4-02"
      - "Xray-VLESS-IPv6-03"
      - "Xray-VLESS-IPv6-04"
      - "Hysteria-IPv4-01"
      - "Hysteria-IPv4-02"
      - "Hysteria-IPv4-03"
      - "Hysteria-IPv4-04"
      - "Hysteria-IPv6-05"
      - "Hysteria-IPv6-06"
      - "Xray-VLESS-Backup-05"

  - name: 🎯 全球直连
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择

  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🚀 节点选择
      - 🎯 全球直连

# 分流规则 (精简高兼容，避免 Android/Karing 缺少 GeoSite 库报错)
rules:
  - GEOIP,LAN,DIRECT,no-resolve
  - GEOIP,CN,DIRECT
  - MATCH,🚀 节点选择
