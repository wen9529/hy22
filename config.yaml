# 策略组配置
proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - ⚖️ 负载均衡
      - DIRECT
      - "Xray-VLESS-01"
      - "Xray-VLESS-02"
      - "Xray-VLESS-03"
      - "Xray-VLESS-04"
      - "Xray-VLESS-05"
      - "Xray-VLESS-06"
      - "Xray-VLESS-07"
      - "Xray-VLESS-08"
      - "Hysteria-01"
      - "Hysteria-02"
      - "Hysteria-03"
      - "Hysteria-04"

  - name: ♻️ 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
      - "Xray-VLESS-01"
      - "Xray-VLESS-02"
      - "Xray-VLESS-03"
      - "Xray-VLESS-04"
      - "Xray-VLESS-05"
      - "Xray-VLESS-06"
      - "Xray-VLESS-07"
      - "Xray-VLESS-08"
      - "Hysteria-01"
      - "Hysteria-02"
      - "Hysteria-03"
      - "Hysteria-04"

  - name: ⚖️ 负载均衡
    type: load-balance
    strategy: consistent-hashing
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - "Xray-VLESS-01"
      - "Xray-VLESS-02"
      - "Xray-VLESS-03"
      - "Xray-VLESS-04"
      - "Xray-VLESS-05"
      - "Xray-VLESS-06"
      - "Xray-VLESS-07"
      - "Xray-VLESS-08"
      - "Hysteria-01"
      - "Hysteria-02"
      - "Hysteria-03"
      - "Hysteria-04"

  - name: 🎯 全球直连
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择

  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🚀 节点选择
      - 🎯 全球直连

# 分流规则
rules:
  - GEOIP,LAN,DIRECT,no-resolve
  - GEOIP,CN,DIRECT
  - MATCH,🚀 节点选择
