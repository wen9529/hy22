# -------------------------------------------------------------
# Clash Meta (Mihomo) 自动订阅配置模板 (双栈 IPv4 / IPv6 全面优化版)
# -------------------------------------------------------------
port: 7890
socks-port: 7891
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: true # 关键：开启 IPv6 支持，确保原生 IPv6 节点与双栈网络顺畅连接
unified-delay: true
tcp-concurrent: true
external-controller: 127.0.0.1:9090

dns:
  enable: true
  ipv6: true
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 1.1.1.1
    - 8.8.8.8
    - 2400:3200::1
    - 2606:4700:4700::1111

