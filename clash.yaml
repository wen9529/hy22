# 策略组配置
proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - ⚖️ 负载均衡
      - DIRECT
      - "Hysteria2-01"
      - "Hysteria2-02"
      - "Hysteria2-03"
      - "Hysteria2-04"
      - "Hysteria2-05"
      - "Hysteria2-06"
      - "Hysteria2-07"
      - "Hysteria2-08"

  - name: ♻️ 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
      - "Hysteria2-01"
      - "Hysteria2-02"
      - "Hysteria2-03"
      - "Hysteria2-04"
      - "Hysteria2-05"
      - "Hysteria2-06"
      - "Hysteria2-07"
      - "Hysteria2-08"

  - name: ⚖️ 负载均衡
    type: load-balance
    strategy: consistent-hashing
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - "Hysteria2-01"
      - "Hysteria2-02"
      - "Hysteria2-03"
      - "Hysteria2-04"
      - "Hysteria2-05"
      - "Hysteria2-06"
      - "Hysteria2-07"
      - "Hysteria2-08"

  - name: 🎯 全球直连
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择

  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🚀 节点选择
      - 🎯 全球直连

# 分流规则 (精简高兼容，避免 Android/Karing 缺少 GeoSite 库报错)
rules:
  - GEOIP,LAN,DIRECT,no-resolve
  - GEOIP,CN,DIRECT
  - MATCH,🚀 节点选择
