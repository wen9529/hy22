name: 自动提取节点并生成 Clash 订阅

on:
  schedule:
    # 按照设定时间定时运行 (每 6 小时自动运行一次)
    - cron: '0 */6 * * *'
  workflow_dispatch: # 支持在 GitHub 仓库 Actions 页面手动点击运行
    inputs:
      force_update:
        description: '强制更新并提交 (即使节点无变化)'
        required: false
        type: boolean
        default: false
  push:
    paths:
      - 'urls.txt'
      - 'urls_hy2.txt'
      - 'template.yaml'
      - 'scripts/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # 必须赋予写入权限以提交生成的订阅文件

jobs:
  update-nodes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库代码 (Checkout Repository)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装 Python 运行环境 (Setup Python)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖 (Install Dependencies)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests pyyaml
          fi

      - name: 执行节点提取与转换 (Extract & Convert Nodes)
        env:
          FORCE_UPDATE: ${{ github.event.inputs.force_update || 'false' }}
        run: |
          python scripts/convert.py

      - name: 检查并提交生成的文件 (Commit and Push)
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          # 暂存所有自动生成的订阅文件
          git add config.yaml config.b64 hy2_config.yaml hy2_config.b64 hy2_links.txt clash.yaml singbox.json sub.txt 2>/dev/null || true
          
          if [[ -n $(git status -s) || "${{ github.event.inputs.force_update }}" == "true" ]]; then
            echo "检测到文件变更，正在提交并推送..."
            git commit -m "chore(auto): 自动更新节点配置 [skip ci]" || echo "无新修改需要提交"
            git pull --rebase origin main || true
            git push origin main
            echo "推送成功！"
          else
            echo "节点配置与输出文件无变动，跳过提交。"
          fi
